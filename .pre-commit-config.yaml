# The old elm-pages site (src/, public/, grafikk/, …) stays in the tree until
# the cleanup phase; its generated and binary files are not hand-edited, so the
# text fixers must leave them alone.
exclude: |
  (?x)^(
    (.*/)?registry\.dat|
    (.*/)?elm-srcs\.nix|
    grafikk/.*|
    dist/.*|
    \.elm-pages/.*|
    (.*/)?elm-stuff/.*|
    result/.*|
    \.direnv/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Full-resolution course photos feed the old site's image pipeline.
        # The embedded photos' masters in static/photos-src stay under the
        # limit (2400 px, JPEG Q84), so they need no exception.
        exclude: ^public/arrangementer/2026-takkebakstkurs-anita-saga-[12]\.jpeg$
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: nix fmt --
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD~1 --fix
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test -race -short -timeout=5m ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: vendorhash
        name: vendorhash check
        entry: go run ./cmd/vendorhash check
        language: system
        files: ^(go\.mod|go\.sum|flakehashes\.json)$
        pass_filenames: false
